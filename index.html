<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실시간 급상승 키워드</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial,"Malgun Gothic",sans-serif;
  background:#f4f5f7;
  color:#151515;
  overflow:hidden;
}
.wrap{
  width:100%;
  height:100vh;
  margin:0 auto;
  padding:5px 7px;
}
.notice{
  height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:700;
}
.header{
  height:31px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 2px;
}
.header h1{
  margin:0;
  font-size:18px;
}
.subtitle{
  margin-left:8px;
  font-size:10px;
  color:#777;
  font-weight:400;
}
.updated{
  font-size:9px;
  color:#777;
  white-space:nowrap;
}
.grid{
  height:calc(100vh - 66px);
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
}
.panel{
  height:100%;
  min-width:0;
  background:#fff;
  border:1px solid #dfe2e7;
  border-radius:7px;
  overflow:hidden;
}
.panel-head{
  height:27px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7px;
  border-bottom:1px solid #e8eaed;
}
.country{
  font-size:14px;
  font-weight:800;
}
.code{
  font-size:8px;
  color:#777;
}
.rows{
  height:calc(100% - 27px);
  display:grid;
  grid-template-rows:repeat(10,1fr);
}
.row{
  min-height:0;
  display:grid;
  grid-template-columns:27px minmax(0,1fr);
  align-items:center;
  gap:4px;
  padding:0 6px;
  border-bottom:1px solid #f0f1f3;
}
.row:last-child{border-bottom:0}
.rank{
  font-size:10px;
  font-weight:700;
  color:#777;
  text-align:center;
}
.query{
  display:block;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#111;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
  line-height:1;
}
.query:hover{text-decoration:underline}
.message{
  padding:18px;
  font-size:13px;
  color:#666;
}
@media(max-width:1000px){
  body{overflow:auto}
  .wrap{height:auto}
  .header{
    height:auto;
    align-items:flex-start;
    gap:6px;
    padding:4px 2px 8px;
  }
  .header h1{font-size:17px}
  .subtitle{
    display:block;
    margin:2px 0 0;
  }
  .grid{
    height:auto;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .panel{height:620px}
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="notice">실시간 트랜드는 10분 간격으로 업데이트 됩니다.</div>

  <div class="header">
    <div>
      <h1>실시간 급상승 키워드
        <span class="subtitle">네이버 · 구글 · 다음</span>
      </h1>
    </div>
    <div class="updated" id="updated">갱신 확인 중</div>
  </div>

  <div class="grid">
    <section class="panel">
      <div class="panel-head"><div class="country">네이버</div><div class="code">NAVER</div></div>
      <div class="rows" id="naverList"><div class="message">불러오는 중</div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><div class="country">구글</div><div class="code">GOOGLE</div></div>
      <div class="rows" id="googleList"><div class="message">불러오는 중</div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><div class="country">다음</div><div class="code">DAUM</div></div>
      <div class="rows" id="daumList"><div class="message">불러오는 중</div></div>
    </section>
  </div>
</div>

<script>
const PANELS = [
  ["naverList", "naver", "https://search.naver.com/search.naver?query="],
  ["googleList", "google", "https://www.google.com/search?q="],
  ["daumList", "daum", "https://search.daum.net/search?w=tot&q="]
];

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function render(target, rows, searchUrl){
  const safeRows = Array.isArray(rows) ? rows.slice(0, 10) : [];
  const html = safeRows.map((x, idx)=>{
    const pos = x.position || (idx + 1);
    const query = x.query || "";
    const href = (x.url && /^https?:\/\//.test(x.url)) ? x.url : searchUrl + encodeURIComponent(query);

    return `<div class="row">
      <div class="rank">${String(pos).padStart(2,"0")}</div>
      <a class="query"
         href="${esc(href)}"
         target="_blank"
         rel="noopener"
         title="${esc(query)}">${esc(query)}</a>
    </div>`;
  }).join("");

  document.getElementById(target).innerHTML = html || '<div class="message">데이터 없음</div>';
}

function formatUpdated(value){
  const date = value ? new Date(value) : new Date();
  return new Intl.DateTimeFormat("ko-KR", {
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(date);
}

async function loadTrends(){
  try {
    const response = await fetch("/api/trends", { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);

    const payload = await response.json();
    PANELS.forEach(([target, key, searchUrl]) => render(target, payload.data?.[key], searchUrl));
    document.getElementById("updated").textContent = "갱신 " + formatUpdated(payload.updatedAt);
  } catch (error) {
    document.getElementById("updated").textContent = "갱신 실패";
    PANELS.forEach(([target]) => {
      document.getElementById(target).innerHTML = '<div class="message">데이터를 불러오지 못했습니다</div>';
    });
  }
}

loadTrends();
setInterval(loadTrends, 10 * 60 * 1000);
</script>
</body>
</html>
