<script>
const PANELS = [
  ["naverList", "naver", "https://search.naver.com/search.naver?query="],
  ["googleList", "google", "https://www.google.com/search?q="],
  ["daumList", "daum", "https://search.daum.net/search?w=tot&q="]
];

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function render(target, rows, searchUrl, provider){
  const safeRows = Array.isArray(rows) ? rows.slice(0, 10) : [];
  const html = safeRows.map((x, idx)=>{
    const pos = x.position || (idx + 1);
    const query = x.query || "";
    const href = (x.url && /^https?:\/\//.test(x.url)) ? x.url : searchUrl + encodeURIComponent(query);
    const hotClass = idx === 0 ? " hot" : "";

    return `<div class="row${hotClass}">
      <div class="rank">${String(pos).padStart(2,"0")}</div>
      <a class="query"
         href="${esc(href)}"
         target="_blank"
         rel="noopener"
         data-provider="${esc(provider)}"
         data-keyword="${esc(query)}"
         data-rank="${esc(pos)}"
         title="${esc(query)}">${esc(query)}</a>
    </div>`;
  }).join("");

  document.getElementById(target).innerHTML = html || '<div class="message">데이터 없음</div>';
}

function formatUpdated(value){
  const date = value ? new Date(value) : new Date();
  return new Intl.DateTimeFormat("ko-KR", {
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(date);
}

async function loadTrends(){
  try {
    const response = await fetch("/api/trends", { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);

    const payload = await response.json();
    PANELS.forEach(([target, key, searchUrl]) => render(target, payload.data?.[key], searchUrl, key));
    document.getElementById("updated").textContent = "갱신 " + formatUpdated(payload.updatedAt);
  } catch (error) {
    document.getElementById("updated").textContent = "갱신 실패";
    PANELS.forEach(([target]) => {
      document.getElementById(target).innerHTML = '<div class="message">데이터를 불러오지 못했습니다</div>';
    });
  }
}

document.addEventListener("click", (event) => {
  const link = event.target.closest("a.query");
  if (!link || typeof gtag !== "function") return;

  gtag("event", "keyword_click", {
    provider: link.dataset.provider || "",
    keyword: link.dataset.keyword || "",
    rank: Number(link.dataset.rank || 0),
    link_url: link.href
  });
});

loadTrends();
setInterval(loadTrends, 10 * 60 * 1000);
</script>
